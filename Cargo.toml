[package]
name = "notecli"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal command-line note manager for students and developers"
authors = ["Ransford Addo"]
license = "MIT"

[[bin]]
name = "notecli"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
colored = "2.0"
clap = { version = "4.4", features = ["derive"] }

